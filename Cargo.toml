[workspace]
members = ["client", "data", "ai_models", "server", "onnx_updater"]
resolver = "3"
default-members = ["server"]

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["macros"] }
axum-server = "0.8.0"
burn = { version = "0.20.0-pre.6", features = ["wgpu", "vulkan", "webgpu"] }
burn-import = { version = "0.20.0-pre.6", features = ["onnx", "safetensors", "pytorch", "default"] }
burn-store = "0.20.0-pre.6"
burn-wgpu = "0.20.0-pre.6"
console_error_panic_hook = "0.1.7"
hf-hub = "0.4.3"
image = "0.25.9"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
surrealdb = { version = "2.3.7", features = ["kv-mem"] }
which = "8.0.0"
leptos = { version = "0.8.6", features = ["csr"] }
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = ["MouseEvent", "WheelEvent", "DomRect"] }
gloo-net = "0.6.0"
serde_urlencoded = "0.7.1"
urlencoding = "2.1.3"
js-sys = "0.3.77"
serde-wasm-bindgen = "0.6.5"
getrandom = { version = "0.3.4" }
clap = { version = "4.5.45", features = ["derive"] }
tonic = { version = "0.14.1", features = ["transport"] }
tonic-web = "0.14.1"
tokio = { version = "1.47.1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs"] }
env_logger = "0.11.8"
expanduser = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-web = "0.1.3"
embed_anything = "0.6.7"
walkdir = "2.5.0"
rand = "0.9.2"
rayon = "1.11.0"
bytemuck = "1.23.2"
sha2 = "0.10.9"
hex = "0.4.3"
